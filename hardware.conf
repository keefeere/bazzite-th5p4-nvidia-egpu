# Hardware profile for the validated ASUS ROG Xbox Ally X + TH5P4 stack.
# This is parsed as declarative KEY=value data; it is not executed as a shell
# script. Quoted values cannot contain shell expansion. Hex values must use the
# same spelling as Linux sysfs.

EGPU_CONFIG_VERSION=1
PROFILE_NAME="ASUS ROG Xbox Ally X + TH5P4 + RTX 5070 Ti + HP TB Dock G4"

# Local Plasma user. The installer validates that the name and UID match.
DESKTOP_USER="keefeere"
DESKTOP_UID="1000"

# User-facing names used by status output and the tray widget.
EGPU_DISPLAY_NAME="RTX 5070 Ti"
IGPU_DISPLAY_NAME="AMD Radeon 890M"
ENCLOSURE_DISPLAY_NAME="TH5P4"
DOCK_DISPLAY_NAME="HP Thunderbolt Dock G4"

# Keep the detachable DRM device out of the kernel VT/fbcon path. The iGPU
# remains available for the text console and the fallback login screen.
NVIDIA_DRM_FBDEV=0

# PCI IDs: /sys/bus/pci/devices/0000:xx:yy.z/{vendor,device}
EGPU_VENDOR="0x10de"
EGPU_DEVICE="0x2c05"
EGPU_AUDIO_VENDOR="0x10de"
EGPU_AUDIO_DEVICE="0x22e9"
IGPU_VENDOR="0x1002"
IGPU_DEVICE="0x150e"
TH5P4_VENDOR="0x8086"
TH5P4_DEVICE="0x5786"

# Thunderbolt/USB4 router identity.
TH5P4_TB_VENDOR="0x8087"
TH5P4_TB_DEVICE="0x1234"
TH5P4_TB_NAME="TH5P4"
TH5P4_USB_DIAG_VENDOR="8086"
TH5P4_USB_DIAG_PRODUCT="1234"

# Optional downstream dock profile. Set HP_DOCK_SUPPORT=0 to disable its exact
# PCI-tree and USB checks while retaining the TH5P4 + NVIDIA path.
HP_DOCK_SUPPORT=1
HP_DOCK_TB_VENDOR="0xf0"
HP_DOCK_TB_DEVICE="0x488"
HP_DOCK_TB_NAME="Thunderbolt Dock G4"
HP_DOCK_BRIDGE_VENDOR="0x8086"
HP_DOCK_BRIDGE_DEVICE="0x0b26"
HP_DOCK_NIC_VENDOR="0x8086"
HP_DOCK_NIC_DEVICE="0x5502"
HP_DOCK_NIC_SUBSYSTEM_VENDOR="0x103c"
HP_DOCK_NIC_SUBSYSTEM_DEVICE="0x87b9"
HP_DOCK_DISPLAYLINK_VENDOR="17e9"
HP_DOCK_DISPLAYLINK_PRODUCT="4301"
HP_DOCK_EXPECTED_DESCENDANTS=7
HP_DOCK_EXPECTED_BRIDGES=6
HP_DOCK_INTERNAL_BRIDGE_FUNCTIONS="00.0 01.0 02.0 03.0 04.0"

# Exact clean firmware BDF layout. Local bridge programming is refused if any
# value differs. These are profile inputs, not auto-detected guesses.
EXPECTED_GPU_BDF="0000:03:00.0"
EXPECTED_AUDIO_BDF="0000:03:00.1"
EXPECTED_GPU_BRIDGE_BDF="0000:02:00.0"
EXPECTED_TH5P4_UPSTREAM_BDF="0000:01:00.0"
EXPECTED_USB4_ROOT_PORT_BDF="0000:00:01.1"
EXPECTED_IGPU_BDF="0000:64:00.0"

# Firmware bus map and the validated three-port local reservation.
ROOT_BUS_SECONDARY=0x01
ROOT_BUS_SUBORDINATE=0x60
UPSTREAM_BUS_SECONDARY=0x02
GPU_BUS_SECONDARY=0x03
FIRMWARE_UNUSED_FIRST_BUS=0x07
PORT1_BUS_START=0x04
PORT1_BUS_END=0x22
PORT2_BUS_START=0x23
PORT2_BUS_END=0x41
PORT3_BUS_START=0x42
PORT3_BUS_END=0x60

# Clean firmware bridge windows measured before local reservation.
ROOT_IO_START=0xb000
ROOT_IO_END=0xefff
ROOT_MMIO_START=0xc4000000
ROOT_MMIO_END=0xdbffffff
ROOT_PREF_START=0x6000000000
ROOT_PREF_END=0x7fffffffff
GPU_IO_START=0xb000
GPU_IO_END=0xbfff
GPU_MMIO_START=0xc4000000
GPU_MMIO_END=0xc80fffff
GPU_PREF_START=0x6000000000
GPU_PREF_END=0x6401ffffff

# Minimum and target reserve sizes.
MIN_BUSES_PER_PORT=22
MIN_IO_BYTES=12288
MIN_MMIO_BYTES=33554432
MIN_PREF_BYTES=33554432
TARGET_MMIO_BYTES=134217728
TARGET_PREF_BYTES=1073741824

# Required physical-function BAR sizes for the exact validated devices.
EGPU_BAR0_SIZE=67108864
EGPU_BAR1_SIZE=17179869184
EGPU_BAR3_SIZE=33554432
EGPU_BAR5_SIZE=128
EGPU_AUDIO_BAR0_SIZE=16384
HP_NIC_BAR0_SIZE=1048576
HP_NIC_BAR3_SIZE=16384
