# Prevent modalias/udev from loading the NVIDIA stack automatically.
# An explicit `modprobe nvidia` after USB4/Thunderbolt initialization still
# works; modprobe blacklist rules suppress alias-based automatic loading only.
blacklist nvidia
blacklist nvidia_drm
blacklist nvidia_modeset
blacklist nvidia_uvm
blacklist nvidia_peermem

# Block explicit requests too (KWin, Vulkan/GL ICDs, NVML, browsers, etc.).
# A controlled post-login load can bypass this with:
#   modprobe --ignore-install nvidia
install nvidia /usr/bin/false
