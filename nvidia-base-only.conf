# Diagnostic modprobe configuration: load only the NVIDIA core module.
# It intentionally omits Bazzite's post-softdeps (nvidia-uvm and nvidia-drm).
# Deployment-specific host policy such as RMDisableNoncontigAlloc is detected
# and passed explicitly by egpu-load-nvidia-gen3.sh at module-load time.
softdep nvidia pre: ecdh_generic ecdsa_generic
options nvidia NVreg_UseKernelSuspendNotifiers=1 NVreg_TemporaryFilePath=/var/tmp NVreg_EnableS0ixPowerManagement=1 NVreg_PreserveVideoMemoryAllocations=1
# Keep the host's integrated GPU framebuffer as the VT/console device.  When
# the detachable NVIDIA DRM device owns fbdev, the kernel console can retain
# nvidia_drm after the Plasma session has ended and prevent safe module unload.
options nvidia_drm modeset=1 fbdev=0
